[package]
name = "pipewire-flow"
description = "Safe Rust bindings to pipewire-flow, a C library that gives PipeWire applications a simpler API"
readme = "README.md"
categories = ["api-bindings", "multimedia"]
keywords = ["pipewire", "audio", "video", "capture", "playback"]
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["bindgen"]
# Generate the FFI bindings from the installed headers at build time.
bindgen = ["pipewire-flow-sys/bindgen"]
# Build the C sources pipewire-flow-sys ships instead of probing pkg-config.
vendored = ["pipewire-flow-sys/vendored"]

[dependencies]
pipewire-flow-sys = { version = "0.2.0", path = "../pipewire-flow-sys", default-features = false }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
